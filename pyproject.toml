[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-quant-v1"
version = "0.1.0"
description = "Auditable SQLite data foundation for A-share research"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pandas>=2,<4", "requests>=2.32,<3"]
akshare = ["akshare==1.19.1", "pandas>=2,<4", "requests>=2.32,<3"]
demo = ["streamlit>=1.40,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
markers = ["manual_integration: live AKShare call, requires --run-akshare-integration"]
